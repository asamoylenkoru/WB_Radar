# WB Radar workflow is DISABLED.
# Previously ran every 30 minutes via GitHub Actions and sent failure emails.
# To re-enable: move this file to `.github/workflows/wb-radar.yml` and restore triggers.

name: WB Radar

# No triggers — workflow will not run until re-enabled.
on:
  workflow_dispatch:
    # Manual runs only after this file is restored under .github/workflows/

permissions:
  contents: write

concurrency:
  group: wb-radar
  cancel-in-progress: false

jobs:
  run:
    if: false  # permanently disabled
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run bot
        env:
          WB_RADAR_TELEGRAM_TOKEN: ${{ secrets.WB_RADAR_TELEGRAM_TOKEN }}
        run: python3 wb_radar_bot.py

      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/wb_radar_state.json
          git diff --cached --quiet || git commit -m "Update WB Radar state"
          git push
